<svg viewBox="0 0 1584 396" width="1584" height="396" xmlns="http://www.w3.org/2000/svg">
  <!-- Nuvoc LinkedIn Banner · 1584×396 · right-shifted · clear of profile picture -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@200&amp;family=DM+Mono:wght@300&amp;display=swap');
    </style>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="#080C10"/>
  <rect width="1584" height="396" fill="url(#grid)"/>

  <!-- Left amber stripe -->
  <rect x="0" y="0" width="3" height="396" fill="#E8960A" opacity="0.6"/>

  <!-- ── MARK — center at x=730, y=198 ── -->
  <!-- White arc: top (270°) clockwise to inflection -->
  <path d="M 730 76 A 122 122 0 0 1 843.7 242.1"
        fill="none" stroke="rgba(255,255,255,0.90)" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Amber arc: inflection to amber stop -->
  <path d="M 843.7 242.1 A 122 122 0 0 1 759.5 316.4"
        fill="none" stroke="#E8960A" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Dot at bottom -->
  <circle cx="730" cy="320" r="13" fill="#E8960A"/>
  <circle cx="730" cy="320" r="27" fill="none" stroke="#E8960A" stroke-width="1.5" opacity="0.22"/>

  <!-- Divider -->
  <rect x="892" y="80" width="1" height="236" fill="rgba(255,255,255,0.08)"/>

  <!-- Wordmark -->
  <text x="932" y="234"
        font-family="Outfit, sans-serif"
        font-weight="200"
        font-size="112"
        letter-spacing="-2">
    <tspan fill="#E8960A">NU</tspan><tspan fill="none" stroke="rgba(255,255,255,0.88)" stroke-width="1.2" paint-order="stroke">VOC</tspan>
  </text>

  <!-- Tagline -->
  <text x="935" y="282"
        font-family="DM Mono, monospace"
        font-weight="300"
        font-size="18"
        letter-spacing="4"
        fill="rgba(255,255,255,0.30)">AI CLINICAL OPS FOR LATAM</text>

  <!-- Domain bottom right -->
  <text x="1540" y="370"
        text-anchor="end"
        font-family="DM Mono, monospace"
        font-weight="300"
        font-size="16"
        letter-spacing="2"
        fill="rgba(232,150,10,0.55)">nuvoc.health</text>
</svg>
